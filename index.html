<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Agzakhangi App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="loginPage" class="screen-center">
        <div class="login-card">
            <h1 class="app-logo">Agza<span>khangi</span></h1>
            <p class="app-info">النظام الصيدلي المتكامل 2026</p>
            
            <div class="input-group">
                <input type="email" id="email" placeholder="البريد الإلكتروني">
                <input type="password" id="pass" placeholder="كلمة المرور">
            </div>
            
            <button class="btn-main-anim" onclick="App.login()">تسجيل الدخول</button>
            
            <div class="google-lite" onclick="App.googleAuth()">
                <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" alt="">
                المتابعة بواسطة جوجل
            </div>
        </div>
    </div>

    <div id="mainApp" class="app-content hidden">
        <header class="main-header">
            <div class="user-bar">
                <div class="user-text">
                    <h2 id="welcomeName">أهلاً بك يا عميلنا العزيز</h2>
                    <p>دواؤك يصلك في دقائق معدودة 🚀</p>
                </div>
                <div class="header-btns">
                    <button onclick="App.share()"><i class="fas fa-share-nodes"></i></button>
                </div>
            </div>
            <div class="search-bar">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="بحث عن دواء..." onkeyup="App.search(this.value)">
            </div>
        </header>

        <div id="productsGrid" class="meds-grid"></div>

        <div id="cartBar" class="cart-strip hidden">
            <div class="cart-data">
                <span id="cartQty">0</span> منتجات | 
                <span id="cartSum">0.00</span> ج.م
            </div>
            <button class="btn-checkout" onclick="App.checkout()">تأكيد الطلب</button>
        </div>

        <div class="ai-bot" onclick="App.aiHelp()">
            <i class="fas fa-robot"></i>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
