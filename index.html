<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أجزخانجي - Agzakhangi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">Agza<span>khangi</span></div>
        <p class="slogan">صيدليتك في جيبك</p>
    </header>

    <div class="search-section">
        <input type="text" id="searchInput" placeholder="ابحث عن دواء، فيتامين، أو منتج..." onkeyup="app.search()">
    </div>

    <main id="productsGrid" class="products-grid">
        </main>

    <div class="bottom-nav">
        <div class="cart-info">
            <span id="cartCount">0</span> أصناف | <span id="totalPrice">0.00</span> ج.م
        </div>
        <button class="checkout-btn" onclick="app.checkout()">تأكيد الطلب ←</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
