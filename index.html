<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agzaخngy e.g | Ultra Pro</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="loader" class="loader-wrapper">
        <div class="loader-content">
            <h1 class="brand-loader">Agza<span>خ</span>ngy</h1>
            <div class="progress-bar"><div class="progress-fill"></div></div>
        </div>
    </div>

    <div id="loginPage" class="screen">
        <div class="login-overlay"></div>
        <div class="login-card">
            <div class="login-header">
                <h1 class="brand-logo">Agza<span>خ</span>ngy<span> e.g</span></h1>
                <p>صيدليتك الذكية بلمسة أمازون</p>
            </div>
            
            <div class="login-body">
                <button class="btn-google" onclick="app.login('user')">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google">
                    <span>الدخول بحساب جوجل</span>
                </button>
                
                <div class="divider"><span>أو دخول المدير</span></div>
                
                <div class="admin-entry">
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="adminPass" placeholder="كلمة السر الخاصة بالوالد">
                    </div>
                    <button class="btn-admin" onclick="app.login('admin')">دخول لوحة التحكم</button>
                </div>
            </div>
            <div class="login-footer">© 2026 Agzakhangi Systems</div>
        </div>
    </div>

    <div id="mainApp" class="screen hidden">
        
        <header class="amz-header">
            <div class="top-nav">
                <div class="menu-btn" onclick="app.toggleMenu()"><i class="fas fa-bars"></i></div>
                <div class="brand">Agza<span>خ</span>ngy<span> e.g</span></div>
                <div class="nav-icons">
                    <div class="icon-badge" onclick="app.scrollToCart()">
                        <i class="fas fa-shopping-basket"></i>
                        <span id="cartCount">0</span>
                    </div>
                    <i class="fas fa-share-nodes" onclick="app.shareApp()"></i>
                </div>
            </div>
            
            <div class="search-section">
                <div class="search-container">
                    <input type="text" id="searchInput" placeholder="ابحث عن أدوية، فيتامينات، أو مستلزمات..." onkeyup="app.search()">
                    <button class="search-btn"><i class="fas fa-magnifying-glass"></i></button>
                </div>
            </div>
        </header>

        <aside id="adminPanel" class="admin-panel hidden">
            <div class="panel-header">
                <h3><i class="fas fa-user-shield"></i> لوحة إدارة الصيدلية</h3>
                <button onclick="app.closeAdmin()"><i class="fas fa-times"></i></button>
            </div>
            <div class="panel-body">
                <div class="input-box">
                    <label>تغيير اسم العلامة التجارية:</label>
                    <input type="text" id="newStoreName" placeholder="Agzaخngy e.g">
                </div>
                <hr>
                <div class="input-box">
                    <label>إضافة دواء جديد للمخزن:</label>
                    <input type="text" id="medName" placeholder="اسم الدواء (مثال: بانادول)">
                    <input type="number" id="medPrice" placeholder="السعر بالجنيه">
                    <input type="text" id="medImg" placeholder="رابط صورة الدواء">
                    <button class="btn-save" onclick="app.saveData()">حفظ ونشر التعديلات ✅</button>
                </div>
            </div>
        </aside>

        <main class="content-area">
            <div class="category-scroll">
                <button class="cat-btn active">الكل</button>
                <button class="cat-btn">مسكنات</button>
                <button class="cat-btn">مضادات</button>
                <button class="cat-btn">فيتامينات</button>
            </div>
            
            <div class="products-grid" id="productsGrid">
                </div>
        </main>

        <footer id="cartFooter" class="cart-footer">
            <div class="cart-summary">
                <div class="total-label">إجمالي الطلب:</div>
                <div class="total-amount"><span id="totalPrice">0.00</span> <small>ج.م</small></div>
            </div>
            <button class="btn-checkout" onclick="app.checkout()">
                <span>تأكيد الطلب</span>
                <i class="fas fa-arrow-left"></i>
            </button>
        </footer>
    </div>

    <div id="toast" class="toast hidden">تمت الإضافة للسلة بنجاح!</div>

    <script src="script.js"></script>
</body>
</html>
