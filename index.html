<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Agzakhangi OS v7.0</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="loginScreen" class="full-screen">
        <div class="auth-card">
            <h1 class="brand">Agza<span>khangi</span></h1>
            <p class="tagline">نظام إدارة الصيدلية الرقمي 2026</p>
            
            <div class="input-set">
                <input type="email" id="emailField" placeholder="البريد الإلكتروني">
                <input type="password" id="passField" placeholder="كلمة المرور">
                <button class="primary-btn" onclick="Core.Auth.handleLogin()">دخول آمن</button>
            </div>
            
            <div class="google-btn-container">
                <button class="google-lite-btn" onclick="Core.Auth.googleSignIn()">
                    <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" alt="G">
                    <span>المتابعة عبر جوجل</span>
                </button>
            </div>
        </div>
    </div>

    <div id="appScreen" class="full-screen hidden">
        <header class="main-header">
            <div class="top-bar">
                <div class="user-meta">
                    <img src="https://ui-avatars.com/api/?name=User&background=482683&color=fff" class="user-img">
                    <div class="user-text">
                        <h2 id="welcomeUser">أهلاً بك يا عميلنا العزيز</h2>
                        <p class="promo-text">دواؤك يصلك في دقائق معدودة 🚀</p>
                    </div>
                </div>
                <div class="nav-tools">
                    <button class="tool-btn" onclick="Core.UI.shareApp()"><i class="fas fa-share-nodes"></i></button>
                </div>
            </div>
            <div class="search-orbital">
                <i class="fas fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="ابحث عن الدواء أو المستلزمات..." onkeyup="Core.Store.filterItems()">
            </div>
        </header>

        <section id="medsGrid" class="meds-grid"></section>

        <footer id="cartTerminal" class="cart-strip hidden">
            <div class="cart-content">
                <div class="cart-stats">
                    <span id="itemCount" class="badge">0</span>
                    <span class="price-tag">الإجمالي: <b id="totalPrice">0.00</b> ج.م</span>
                </div>
                <button class="checkout-btn" onclick="Core.Store.completeOrder()">تأكيد الطلب</button>
            </div>
        </footer>

        <div class="ai-button" onclick="Core.AI.getHelp()">
            <i class="fas fa-robot"></i>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
