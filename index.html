<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agzakhangi | أجزخانجي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="loginPage" class="auth-wrapper">
        <div class="auth-card">
            <h1 class="logo">Agza<span>khangi</span></h1>
            <p class="tagline">صيدليتك الذكية بلمسة أمازون</p>
            
            <div class="field">
                <input type="email" id="userEmail" placeholder="البريد الإلكتروني">
            </div>
            <div class="field">
                <input type="password" id="userPass" placeholder="كلمة مرورك">
            </div>
            
            <button class="btn-primary" onclick="app.authenticate()">تسجيل الدخول</button>
            <div class="divider">أو</div>
            <button class="btn-google" onclick="app.authenticate('google')">
                <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" alt="">
                متابعة باستخدام جوجل
            </button>
        </div>
    </div>

    <div id="mainApp" class="hidden">
        <header class="app-header">
            <div class="welcome-bar">
                <div class="user-info">
                    <span id="welcomeText">أهلاً بك يا عميلنا العزيز</span>
                    <p class="sub-welcome">دواؤك يصلك في دقائق معدودة 🚀</p>
                </div>
                <div class="top-icons">
                    <i class="fas fa-qrcode" onclick="app.scan()"></i>
                    <i class="fas fa-share-alt" onclick="app.share()"></i>
                </div>
            </div>
            
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="ابحث عن الدواء، الفيتامينات، أو المستلزمات..." onkeyup="app.search()">
            </div>
        </header>

        <main id="productsGrid" class="products-container"></main>

        <div class="shopping-cart-bar">
            <div class="cart-details">
                <div class="cart-icon-wrapper">
                    <i class="fas fa-shopping-bag"></i>
                    <span id="cartCount" class="badge">0</span>
                </div>
                <div class="price-stack">
                    <span class="label">إجمالي الطلب</span>
                    <span class="value"><span id="totalPrice">0.00</span> ج.م</span>
                </div>
            </div>
            <button class="btn-checkout" onclick="app.checkout()">إتمام الطلب</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
